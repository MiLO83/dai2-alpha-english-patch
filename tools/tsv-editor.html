<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dai-2 Alpha Translation Editor</title>
<style>
:root{color-scheme:dark;--bg:#0d131c;--panel:#172231;--line:#3b506a;--text:#edf5ff;--muted:#9cb0c8;--blue:#62c8ff;--green:#91d77e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{position:sticky;top:0;z-index:3;padding:10px 14px;background:#111a27;border-bottom:1px solid var(--line)}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select{padding:7px 10px;border:1px solid #536c89;border-radius:5px;background:#202e40;color:var(--text)}button{cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{opacity:.45;cursor:default}#search{min-width:240px;flex:1}#status{margin-left:auto;color:var(--muted)}#status.dirty:before{content:'● ';color:#ffc55c}main{padding:8px 14px 74px}.head,.row{display:grid;grid-template-columns:72px repeat(3,minmax(0,1fr));gap:8px}.head{position:sticky;top:60px;z-index:2;padding:9px 7px;background:#0d131cee;color:var(--blue);font-weight:700}.row{padding:8px 7px;border-top:1px solid #253449}.row:focus-within{background:#131e2b}.scope{padding:8px 2px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}textarea{width:100%;min-width:0;min-height:76px;resize:vertical;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--text);font:14px/1.35 ui-monospace,monospace}textarea:focus{outline:2px solid #2479a9;border-color:transparent}textarea.user{border-color:#54884c;background:#14251b}footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;padding:9px;background:#111a27ee;border-top:1px solid var(--line)}dialog{width:min(900px,92vw);background:#152131;color:var(--text);border:1px solid var(--line);border-radius:8px}dialog::backdrop{background:#000a}pre{max-height:55vh;overflow:auto;white-space:pre-wrap;background:#090d13;padding:12px;border-radius:5px;color:#b9d5b2}@media(max-width:800px){.head{display:none}.row{grid-template-columns:1fr}.scope{padding-bottom:0}}
.head,.row{grid-template-columns:72px minmax(0,1.5fr) minmax(0,1.5fr) repeat(3,minmax(0,1fr))}.userPages{min-width:0}.fit{font-size:12px;color:var(--muted);padding-top:3px}.fit.bad{color:#ff9d83}
</style>
</head>
<body>
<header><div class="bar">
<button id="open">Open TSV</button><input id="file" type="file" accept=".tsv,text/tab-separated-values" hidden>
<button id="save" disabled>Save</button><button id="saveAs" disabled>Save As</button>
<button id="apply" disabled>Apply Patch</button>
<input id="search" type="search" placeholder="Filter all columns…" disabled><select id="scope" disabled><option value="">All scopes</option></select>
<label><input id="autosave" type="checkbox"> Recovery autosave</label><span id="status">No TSV loaded</span>
</div></header>
<main><div class="head"><div>Scope</div><div>Original Japanese · 25%</div><div>Automatic Translation · 25%</div><div>Your English 1</div><div>Your English 2</div><div>Your English 3</div></div><div id="rows"></div></main>
<footer><button id="prev" disabled>◀ Previous</button><span id="page">No rows</span><button id="next" disabled>Next ▶</button><select id="pageSize"><option>50</option><option selected>100</option><option>250</option><option>500</option></select></footer>
<dialog id="buildDialog"><h2>Apply spreadsheet to ISO</h2><p id="buildState"></p><pre id="buildLog"></pre><form method="dialog"><button id="closeLog">Close</button></form></dialog>
<script>
'use strict';const $=id=>document.getElementById(id);let head=[],rows=[],shown=[],page=0,dirty=false,handle=null,name='all-known-game-text.tsv',timer;
function parse(s){if(s.charCodeAt(0)===0xfeff)s=s.slice(1);let out=[],r=[],f='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"'&&!f)q=true;else if(c==='\t'){r.push(f);f=''}else if(c==='\n'){r.push(f.replace(/\r$/,''));out.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f.replace(/\r$/,''));out.push(r)}return out}
function quote(s){s=String(s??'');return /["\t\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}function text(){return '\ufeff'+[head,...rows].map(r=>r.map(quote).join('\t')).join('\r\n')+'\r\n'}
function mark(v=true){dirty=v;$('status').classList.toggle('dirty',v);$('status').textContent=(v?'Unsaved · ':'')+rows.length.toLocaleString()+' rows · '+name;if(v&&$('autosave').checked){clearTimeout(timer);timer=setTimeout(draft,700)}}
function load(s,n,h=null){let all=parse(s);head=all.shift()||[];let scoped=head[0]==='Scope';if(![3,4,5,6].includes(head.length))throw Error('Expected the Dai-2 Alpha TSV columns.');if(!head.includes('English Page 2')){head.push('English Page 2','English Page 3');all.forEach(r=>r.push('',''))}rows=all.filter(r=>r.some(Boolean)).map(r=>{while(r.length<head.length)r.push('');return r.slice(0,head.length)});name=n;handle=h;page=0;for(let id of ['save','saveAs','apply','search','scope'])$(id).disabled=false;let scopes=scoped?[...new Set(rows.map(r=>r[0]).filter(Boolean))]:[];$('scope').innerHTML='<option value="">All scopes</option>'+scopes.map(s=>'<option>'+esc(s)+'</option>').join('');filter();mark(false);if(!$('autosave').dataset.asked){$('autosave').dataset.asked=1;$('autosave').checked=confirm('Enable recovery autosave for this session?')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filter(){let q=$('search').value.toLowerCase(),sc=$('scope').value,si=head[0]==='Scope'?0:-1;shown=[];rows.forEach((r,i)=>{if((!sc||r[si]===sc)&&(!q||r.some(v=>v.toLowerCase().includes(q))))shown.push(i)});page=0;render()}
function packed(value){let open=value.indexOf('「'),close=value.lastIndexOf('」'),prefix=open>=0?value.slice(0,open+1):'',suffix=close>=open&&open>=0?'」':'',body=open>=0?value.slice(open+1,close>=open?close:value.length):value,words=body.replace(/\s+/g,' ').trim().split(' ').filter(Boolean),lines=[''],rest=[];for(let w of words){let n=lines.at(-1),candidate=n?n+' '+w:w,limit=lines.length===1?Math.max(1,44-prefix.length):44;if(candidate.length<=limit)lines[lines.length-1]=candidate;else if(lines.length<3)lines.push(w);else rest.push(w)}return{page:prefix+lines.join('\n')+suffix,rest:rest.join(' '),prefix,suffix,used:prefix.length+lines.reduce((n,x)=>n+x.length,0)+suffix.length,ok:!rest.length}}
function needsFlow(value){let open=value.indexOf('「'),prefix=open>=0?value.slice(0,open+1).length:0,close=value.lastIndexOf('」'),body=open>=0?value.slice(open+1,close>=open?close:value.length):value,lines=body.split(/\r?\n/);return lines.length>3||lines.some((line,i)=>line.length>(i?44:Math.max(1,44-prefix)))}
function flow(r,off,start){let carry='',template=packed(r[off+2]||'');for(let p=start;p<3;p++){let c=off+2+p,v=r[c]||'';if(carry){let x=packed(v),body=x.prefix?v.slice(x.prefix.length,x.suffix?v.length-x.suffix.length:v.length):v;v=(x.prefix||template.prefix)+carry+(body?' '+body:'')+(x.suffix||template.suffix)}else if(!needsFlow(v))break;let x=packed(v);r[c]=x.page;carry=x.rest;if(!carry)break}return carry}
function render(){let size=+$('pageSize').value,start=page*size,off=head[0]==='Scope'?1:0;$('rows').replaceChildren(...shown.slice(start,start+size).map(i=>{let r=rows[i],el=document.createElement('div'),areas=[],fits=[],dialogue=!off||r[0]==='dialogue';el.className='row';let sc=document.createElement('div');sc.className='scope';sc.textContent=off?r[0]:'#'+(i+1);el.append(sc);for(let c=off;c<off+2;c++){let t=document.createElement('textarea');t.value=r[c]||'';t.oninput=()=>{r[c]=t.value;mark()};el.append(t)}function status(p,msg=''){let v=r[off+2+p]||'',x=packed(v),bad=v.split(/\r?\n/).some(x=>x.length>44);fits[p].textContent=msg||`${x.used}/132 chars · ${v.split(/\r?\n/).length}/3 lines`;fits[p].classList.toggle('bad',!!msg||!x.ok||bad)}for(let p=0;p<3;p++){let box=document.createElement('div'),t=document.createElement('textarea'),f=document.createElement('div');box.className='userPages';t.className='user';f.className='fit';t.value=r[off+2+p]||'';if(p&&!dialogue){t.disabled=true;t.placeholder='Dialogue only'}t.oninput=()=>{r[off+2+p]=t.value;let overflow=flow(r,off,p);for(let q=p;q<3;q++){areas[q].value=r[off+2+q]||'';status(q,q===2&&overflow?'Full — shorten final text':'')}mark()};areas.push(t);fits.push(f);box.append(t,f);el.append(box)}for(let p=0;p<3;p++)status(p);return el}));let pages=Math.max(1,Math.ceil(shown.length/size));$('page').textContent=shown.length?`Page ${page+1}/${pages} · ${shown.length.toLocaleString()} matches`:'No matches';$('prev').disabled=!page;$('next').disabled=!shown.length||page>=pages-1}
async function open(){try{if(window.showOpenFilePicker){[handle]=await showOpenFilePicker({types:[{description:'TSV',accept:{'text/tab-separated-values':['.tsv'],'text/plain':['.tsv']}}]});let f=await handle.getFile();load(await f.text(),f.name,handle)}else $('file').click()}catch(e){if(e.name!=='AbortError')alert(e.message)}}
async function save(as=false){try{if(as||!handle){if(window.showSaveFilePicker)handle=await showSaveFilePicker({suggestedName:name,types:[{description:'TSV',accept:{'text/tab-separated-values':['.tsv']}}]});else{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text()],{type:'text/tab-separated-values'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);mark(false);return true}}let w=await handle.createWritable();await w.write(text());await w.close();name=handle.name;mark(false);clearDraft();return true}catch(e){if(e.name!=='AbortError')alert('Save failed: '+e.message);return false}}
function db(){return new Promise((ok,no)=>{let r=indexedDB.open('dai2-tsv',1);r.onupgradeneeded=()=>r.result.createObjectStore('draft');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function draft(){if(!dirty||!$('autosave').checked)return;let d=await db();d.transaction('draft','readwrite').objectStore('draft').put({text:text(),name,time:Date.now()},'last')}async function clearDraft(){let d=await db();d.transaction('draft','readwrite').objectStore('draft').delete('last')}async function recover(){let d=await db(),v=await new Promise(ok=>{let r=d.transaction('draft').objectStore('draft').get('last');r.onsuccess=()=>ok(r.result)});if(v&&confirm(`Recover autosaved “${v.name}” from ${new Date(v.time).toLocaleString()}?`)){load(v.text,v.name);$('autosave').checked=true;mark()}}
async function applyPatch(){if(location.protocol==='file:'){alert('Apply Patch requires tools/run-tsv-editor.sh. Open the localhost URL it prints.');return}if(dirty&&!confirm('Build from the current unsaved edits? The recovery draft will be updated first.'))return;await draft();$('buildDialog').showModal();$('buildState').textContent='Starting ISO build…';$('buildLog').textContent='';$('apply').disabled=true;try{let r=await fetch('/api/build',{method:'POST',headers:{'Content-Type':'text/tab-separated-values'},body:text()});if(!r.ok)throw Error(await r.text());poll()}catch(e){$('buildState').textContent='Could not start build';$('buildLog').textContent=e.message;$('apply').disabled=false}}
async function poll(){try{let s=await (await fetch('/api/status')).json();$('buildState').textContent=s.state+(s.output?' · '+s.output:'');$('buildLog').textContent=s.log;$('buildLog').scrollTop=$('buildLog').scrollHeight;if(s.state==='running')setTimeout(poll,750);else $('apply').disabled=false}catch(e){$('buildState').textContent='Status error';$('buildLog').textContent+=e.message;$('apply').disabled=false}}
$('open').onclick=open;$('save').onclick=()=>save();$('saveAs').onclick=()=>save(true);$('apply').onclick=applyPatch;$('file').onchange=async e=>{let f=e.target.files[0];if(f)load(await f.text(),f.name)};$('search').oninput=filter;$('scope').onchange=filter;$('pageSize').onchange=render;$('prev').onclick=()=>{page--;render();scrollTo(0,0)};$('next').onclick=()=>{page++;render();scrollTo(0,0)};$('autosave').onchange=()=>{if($('autosave').checked)draft()};addEventListener('beforeunload',e=>{if(dirty){draft();e.preventDefault();e.returnValue=''}});recover().catch(console.error);
</script><script src="tsv-editor-extra.js"></script></body></html>
